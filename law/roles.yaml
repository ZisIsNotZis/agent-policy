manager:
  description: An agent with a directory, a document and a roadmap of its own. Splits its work into children and answers for them.
  guide: manager
  tools: read, edit, write, bash, grep, find, ls, subagent
  thinking: high
worker:
  description: Executes exactly one work package in its parent's directory, and reports once.
  guide: worker
  tools: read, edit, write, bash, grep, find, ls
  thinking: high
root:
  description: The one node whose parent is the person. Speaks to them and to nobody else, and answers for the whole tree.
  tools: read, edit, write, bash, grep, find, ls, subagent
  thinking: max
