# The one schema for AGENTS.yaml, enforced by tools/policy.py.
#
# The tree is a forest of top-level fact nodes. A fact carries `_fact`; a goal or
# practice carries `_goal`. `_who` is inherited from the nearest ancestor that
# declares it: a node under no `_who` is not rendered. Fields are written only
# when needed. `_fact` and `_know` are authoring fields and never rendered: `_fact`
# is a premise, `_know` is the reason the rule exists, and both are read by
# whoever changes the rule, not by the role that acts on it.
version: 2

bilingual: true

text_fields:
  - _fact
  - _when
  - _know
  - _goal
  - _how

list_fields:
  - _who
  - _other_parents
  - _depends_on

# `_comment` is the recorded exception: a string, or {why, recheck_when}.
# It is printed as information, so a deliberate exception is visible to the next
# editor instead of being re-reported as a defect.
comment_field: _comment

forbidden:
  - _kind
  - _why
  - _action
  - _scope
  - _choices
  - _order

node_required_any:
  - _fact
  - _goal
