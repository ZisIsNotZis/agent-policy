ssot:
  _when: 你要记下一条事实
  _know: 它住在哪几个文件里；谁会读它
  _why: [derived]
  _depends_on: [cost]
  _scope: [root, manager]
  _choices:
    - move: 把事实写进拥有它的那份文件，删掉旧的那份
      gain: 只有一个家
      cost: 写的地方不在手边
    - move: 在出现的地方留一行指针
      gain: 不用复制内容
      cost: 读者要能解析
  _goal: 新人认出该信哪一份是件小事
cost:
  _when: 你要写一个代价
  _know: ""
  _scope: [root]
  _choices:
    - move: 用七种单位之一写
      gain: 读者能比较
      cost: 要选一个单位
    - move: 用一句话写
      gain: 写起来自由
      cost: 比较不了
  _goal: 代价读得懂
derived:
  _when: 你要记一个派生值
  _know: ""
  _scope: [root]
  _choices:
    - move: 写指针
      gain: 不漂
      cost: 读者要解析
    - move: 写值
      gain: 直接可读
      cost: 会漂
  _goal: 派生值跟着来源
