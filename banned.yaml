# A banned term is a word that pulls the work into another frame: the ceremony
# around a unit of work, a route that does not exist, generic reporting, or the
# meta-machinery around the law. Each term names something this corpus already
# has a word for, and the word beside it is the one to write instead. A hit
# fails the check, in either language and in node names. A term leaves this file
# only when the corpus has no word for what it names.
banned:
  # a unit of work -> work package, milestone, roadmap item
  - backlog
  - sprint
  - epic
  - phase
  - stage
  - wave
  - checkpoint
  - task
  - subtask
  - ticket
  # a route that does not exist -> roadmap, method
  - plan
  # generic reporting -> report, decision, gate
  - status report
  - summary
  - update
  - signoff
  - approval step
  # the meta-machinery around the law -> the law, the node, the evidence
  - prompt
  - rules file
  - policy node
  - mapping
  - inventory
  - entry
  - proof
  - citation
  # the harness's own words -> child, manager, role
  - subagent
  - supervisor
  - executor
  - task runner
  - agent type
  - role tier

# The same terms in Chinese. The zh half of a rule is a restatement, not a
# translation of the English words, so a concept can survive there alone.
banned_zh:
  - 子代理
  - 任务
  - 计划
  - 阶段
  - 提示词
  - 摘要
  - 更新
  - 路线图阶段
