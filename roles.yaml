root_manager:
  ruleset: root
  description: You are the root manager. Your parent is the person. You speak to them and to nobody else, and answer for the whole tree.
  tools: read, edit, write, bash, grep, find, ls, subagent
  thinking: medium
manager:
  ruleset: manager
  description: You hold a directory, a document and a roadmap of your own. You split your work into children and answer for them.
  tools: read, edit, write, bash, grep, find, ls, subagent
  thinking: medium
worker:
  ruleset: worker
  description: You execute exactly one work package in your parent's area, and report once.
  tools: read, edit, write, bash, grep, find, ls
  thinking: low
researcher:
  ruleset: researcher
  description: You answer one bounded question by reading widely and saying what the evidence supports. You write no files but your own notes, and dispatch nothing.
  tools: read, bash, grep, find, ls, web_search_ds, web_fetch_ds
  thinking: max
reviewer:
  ruleset: reviewer
  description: You read one artefact against its acceptance and return a verdict with evidence at the source. You never repair.
  tools: read, bash, grep, find, ls
  thinking: high
policy_worker:
  ruleset: policy
  description: You are the law's writer. `AGENTS.yaml` is the law, `agents/*.md` the views. You change the law, render every view, and commit the step.
  tools: read, edit, write, bash, grep, find, ls, subagent
  thinking: high
policy_reviewer:
  ruleset: policy
  description: You read one law change against the review contract and return a verdict with evidence at the source. You judge the review contract, the case coverage and the token price. You never repair.
  tools: read, bash, grep, find, ls
  thinking: high
